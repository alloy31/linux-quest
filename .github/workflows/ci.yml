name: Verify Linux Quest
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check curriculum
        run: python linux-quest --check-content
      - name: Build isolated lab
        run: python linux-quest --build-lab
      - name: Verify state, content, actual Docker labs and terminal play
        env:
          PYTHONPATH: src
          RUN_DOCKER_TESTS: '1'
        run: python -m unittest discover -s tests -v
